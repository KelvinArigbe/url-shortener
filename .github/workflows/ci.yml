
name: URL Shortener CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

 permissions:
  contents: read
  packages: write 

jobs:
  build-and-scan:
    name: Validate, Build and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q app.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Check dependencies
        run: pip check

      - name: Build Docker image
        run: docker build -t url-shortener:${{ github.sha }} .

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: url-shortener:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kelvinarigbe/url-shortener:latest
            ghcr.io/kelvinarigbe/url-shortener:${{ github.sha }}
